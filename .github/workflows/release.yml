name: Build and release Sreon
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-14
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the engine
        run: |
          make build/bin/sprfst
          tools/test.sh build/bin/sprfst
      - name: Import signing certificate (optional)
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Build Sreon.app and the disk image
        env:
          SREON_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
        run: tools/build_app.sh --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Sreon
          path: build/Sreon-*.dmg
      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Sreon-*.dmg
